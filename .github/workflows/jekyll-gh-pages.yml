name: GitHub Pages
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Install documentation dependencies
        run: python -m pip install --disable-pip-version-check mkdocs-material
      - name: Build documentation (fail closed)
        run: mkdocs build --strict
      - name: Verify generated artifact excludes edition packs
        shell: bash
        run: |
          set -euo pipefail
          test -s site/index.html
          if [[ -d site/editions ]]; then
            echo "::error::Generated Pages artifact must not contain edition-pack source files."
            find site/editions -type f -print
            exit 1
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
  deploy:
    environment: github-pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
