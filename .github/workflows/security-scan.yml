name: Security Scan
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Detect Python source
        id: source
        run: |
          if find . -path './.git' -prune -o -name '*.py' -print -quit | grep -q .; then
            echo "has_python=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_python=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: github/codeql-action/init@v4
        if: steps.source.outputs.has_python == 'true'
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4
        if: steps.source.outputs.has_python == 'true'
      - name: Explain skipped scan for content-only repository
        if: steps.source.outputs.has_python != 'true'
        run: echo "No Python source is present; code analysis runs in ZQM-Labs/quest-authoring."
