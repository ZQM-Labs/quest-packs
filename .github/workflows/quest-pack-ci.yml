name: Quest Pack CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate-packs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Check out canonical quest validator at a reviewed immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ZQM-Labs/quest-authoring
          ref: feca0db4d999510d022b23655bdc524d8ceee70d # reviewed validator revision: player answer-normalization parity
          path: quest-authoring
      - name: Validate sample pack
        run: python quest-authoring/validator/validate_pack.py sample-quest/wisp-sample.json
      - name: Validate sample kit configuration JSON
        run: python -m json.tool sample-quest/kit-config.sample.json > /dev/null
      - name: Validate every publicly committed edition JSON pack
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packs=(editions/*/*.json)
          if ((${#packs[@]} == 0)); then
            echo "No public edition JSON packs are committed; private edition artifacts are intentionally not required here."
            exit 0
          fi
          for pack in "${packs[@]}"; do
            echo "::group::Validate ${pack}"
            python quest-authoring/validator/validate_pack.py "${pack}"
            echo "::endgroup::"
          done
